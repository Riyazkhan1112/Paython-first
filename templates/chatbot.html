<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Conversation History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-header h1 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .back-to-home {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.8em;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-left-color: white;
        }

        .conversation-item.active {
            background: rgba(255, 255, 255, 0.2);
            border-left-color: #ffd700;
        }

        .conversation-item-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.95em;
        }

        .conversation-item-date {
            font-size: 0.8em;
            opacity: 0.8;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-header h2 {
            color: #333;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.bot .message-bubble {
            background: #e8eaf6;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }

        .message-time {
            font-size: 0.75em;
            opacity: 0.6;
            margin-top: 5px;
            padding: 0 10px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 12px 16px;
            background: #e8eaf6;
            border-radius: 18px 18px 18px 4px;
            width: fit-content;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 150px;
                flex-direction: row;
            }

            .conversations-list {
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }

            .conversation-item {
                min-width: 150px;
            }

            .main-content {
                flex: 1;
            }

            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-to-home">← Home</a>
                <h1>💬 ChatBot</h1>
                <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
            </div>
            <div class="conversations-list" id="conversationsList"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <h2 id="chatTitle">Start a new conversation</h2>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <div class="empty-state-text">No messages yet</div>
                    <div style="font-size: 0.9em;">Start a new chat to begin!</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your message here..."
                        autocomplete="off"
                    >
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConversationId = null;
        let conversations = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadConversations();
            
            // Allow Enter key to send message
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function startNewChat() {
            const title = prompt('Enter chat title (or leave blank for default):') || `Chat ${new Date().toLocaleDateString()}`;
            
            const conversation = {
                id: generateId(),
                title: title,
                messages: [],
                created_at: new Date().toISOString()
            };
            
            conversations.unshift(conversation);
            saveConversations();
            currentConversationId = conversation.id;
            loadConversations();
            clearMessages();
            document.getElementById('chatTitle').textContent = title;
        }

        function loadConversations() {
            conversations = JSON.parse(localStorage.getItem('conversations')) || [];
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';
            
            if (conversations.length === 0) {
                list.innerHTML = '<div style="padding: 20px; opacity: 0.7; font-size: 0.9em;">No conversations yet</div>';
                return;
            }
            
            conversations.forEach(conv => {
                const div = document.createElement('div');
                div.className = 'conversation-item' + (conv.id === currentConversationId ? ' active' : '');
                div.innerHTML = `
                    <div class="conversation-item-title">${escapeHtml(conv.title)}</div>
                    <div class="conversation-item-date">${new Date(conv.created_at).toLocaleDateString()}</div>
                `;
                div.onclick = () => selectConversation(conv.id, conv.title);
                list.appendChild(div);
            });
        }

        function selectConversation(convId, title) {
            currentConversationId = convId;
            document.getElementById('chatTitle').textContent = title;
            loadChatHistory();
            loadConversations();
        }

        function loadChatHistory() {
            if (!currentConversationId) return;
            
            const conversation = conversations.find(c => c.id === currentConversationId);
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            if (!conversation || conversation.messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💭</div><div class="empty-state-text">No messages yet</div></div>';
                return;
            }
            
            conversation.messages.forEach(msg => {
                addMessageToUI(msg.user_message, 'user', msg.created_at);
                addMessageToUI(msg.bot_response, 'bot', msg.bot_created_at);
            });
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            if (!currentConversationId) {
                alert('Please start a new chat first');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Show user message
            addMessageToUI(message, 'user', new Date().toISOString());
            input.value = '';
            
            // Show loading indicator
            const container = document.getElementById('messagesContainer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;
            
            // Send to server
            document.getElementById('sendBtn').disabled = true;
            
            fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message
                })
            })
            .then(res => res.json())
            .then(data => {
                loadingDiv.remove();
                
                if (data.error) {
                    addMessageToUI('Error: ' + data.error, 'bot', new Date().toISOString());
                } else {
                    addMessageToUI(data.bot_response, 'bot', new Date().toISOString());
                    
                    // Save to local storage
                    const conversation = conversations.find(c => c.id === currentConversationId);
                    if (conversation) {
                        conversation.messages.push({
                            user_message: message,
                            bot_response: data.bot_response,
                            created_at: new Date().toISOString(),
                            bot_created_at: new Date().toISOString()
                        });
                        saveConversations();
                    }
                }
                
                container.scrollTop = container.scrollHeight;
                document.getElementById('sendBtn').disabled = false;
            })
            .catch(err => {
                loadingDiv.remove();
                addMessageToUI('Error: ' + err.message, 'bot', new Date().toISOString());
                document.getElementById('sendBtn').disabled = false;
            });
        }

        function addMessageToUI(text, sender, timestamp) {
            const container = document.getElementById('messagesContainer');
            
            // Clear empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const time = new Date(timestamp).toLocaleTimeString();
            msgDiv.innerHTML = `
                <div>
                    <div class="message-bubble">${escapeHtml(text)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function clearMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💭</div><div class="empty-state-text">No messages yet</div></div>';
        }

        function saveConversations() {
            localStorage.setItem('conversations', JSON.stringify(conversations));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
